<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" fill="none" role="img" aria-label="Blood donation illustration">
  <defs>
    <linearGradient id="dropG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5964"/>
      <stop offset="0.55" stop-color="#e11d2a"/>
      <stop offset="1" stop-color="#9d0208"/>
    </linearGradient>
    <linearGradient id="blobG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3e4"/>
      <stop offset="1" stop-color="#ffd0d2"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff5f5"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#9d0208" flood-opacity="0.18"/>
    </filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#9d0208" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- soft background blobs -->
  <path d="M470 90c40 46 58 120 24 178-34 58-120 86-196 92-76 6-142-10-186-58C68 254 60 170 104 116 148 62 232 36 306 38c74 2 124 6 164 52Z" fill="url(#blobG)"/>
  <circle cx="92" cy="96" r="12" fill="#ffb3b8"/>
  <circle cx="486" cy="330" r="9" fill="#ffb3b8"/>
  <circle cx="120" cy="372" r="7" fill="#ff8a93"/>
  <circle cx="430" cy="70" r="6" fill="#ff8a93"/>

  <!-- main droplet -->
  <g filter="url(#soft)">
    <path d="M280 96c52 66 92 112 92 166 0 62-48 104-92 104s-92-42-92-104c0-54 40-100 92-166Z" fill="url(#dropG)"/>
    <path d="M250 150c-18 26-28 52-28 78 0 14 4 28 12 40" stroke="#ffffff" stroke-opacity="0.45" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- ECG / pulse line inside droplet -->
  <path d="M214 286h28l14-34 20 64 16-40 12 20h32" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- heart badge -->
  <g filter="url(#soft2)">
    <circle cx="282" cy="214" r="34" fill="#ffffff"/>
    <path d="M282 232c-20-12-30-22-30-34 0-9 7-15 15-15 6 0 11 3 15 9 4-6 9-9 15-9 8 0 15 6 15 15 0 12-10 22-30 34Z" fill="#e11d2a"/>
  </g>

  <!-- floating blood-type chips -->
  <g filter="url(#soft2)">
    <rect x="62" y="186" width="92" height="56" rx="16" fill="url(#cardG)"/>
    <circle cx="92" cy="214" r="16" fill="#e11d2a"/>
    <text x="92" y="220" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">O−</text>
    <text x="120" y="210" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="700" fill="#7a0313">Universal</text>
    <text x="120" y="226" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#9a6">donor</text>
  </g>

  <g filter="url(#soft2)">
    <rect x="404" y="150" width="96" height="56" rx="16" fill="url(#cardG)"/>
    <circle cx="434" cy="178" r="16" fill="#7a0313"/>
    <text x="434" y="184" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">A+</text>
    <text x="462" y="174" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="700" fill="#7a0313">Needed</text>
    <text x="462" y="190" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#c1121f">now</text>
  </g>

  <!-- verified donor pill -->
  <g filter="url(#soft2)">
    <rect x="356" y="300" width="150" height="48" rx="24" fill="url(#cardG)"/>
    <circle cx="382" cy="324" r="13" fill="#17a398"/>
    <path d="M376 324l4 4 8-8" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="402" y="329" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="600" fill="#1b1b23">Verified donor</text>
  </g>

  <!-- small hospital marker -->
  <g filter="url(#soft2)">
    <rect x="70" y="300" width="60" height="54" rx="14" fill="url(#cardG)"/>
    <rect x="92" y="316" width="16" height="4" rx="2" fill="#e11d2a"/>
    <rect x="98" y="310" width="4" height="16" rx="2" fill="#e11d2a"/>
    <text x="100" y="346" font-family="Poppins, Arial, sans-serif" font-size="10" font-weight="600" fill="#7a0313" text-anchor="middle">Nearby</text>
  </g>
</svg>
