{% extends "base.html" %}
{% block title %}Add photo{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card"><div class="card-body p-4">
    <h4 class="fw-bold mb-3">Add a photo to “{{ request_obj.patient }}”</h4>
    <form method="post" enctype="multipart/form-data">{% csrf_token %}
      <div class="mb-3">{{ form.image }}</div>
      <div class="mb-3"><label class="form-label">Caption</label>{{ form.caption }}</div>
      <button class="btn btn-primary">Upload</button>
      <a href="{% url 'request_detail' request_obj.pk %}" class="btn btn-link">Back</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
