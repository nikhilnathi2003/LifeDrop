{% extends "base.html" %}
{% block title %}{{ title }} – LifeDrop{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7">
  <div class="card"><div class="card-body p-4">
    <h4 class="fw-bold mb-3">{{ title }}</h4>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<div class="text-danger small">{{ field.errors|striptags }}</div>{% endif %}
        </div>
      {% endfor %}
      <div class="mb-3">
        <label class="form-label">Requisition photo (optional)</label>
        <input type="file" name="image" class="form-control" accept="image/*">
      </div>
      <button class="btn btn-primary">Submit request</button>
      <a href="{% url 'home' %}" class="btn btn-link">Cancel</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
