{% extends "base.html" %}
{% block title %}Leave a review – LifeDrop{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center"><div class="col-lg-6">
    <h2 class="ld-section-title mb-1"><i class="bi bi-star-fill text-warning"></i> Leave a review</h2>
    <p class="text-muted">Share your experience with <strong>{{ target.username }}</strong> after helping on
      “{{ request_obj.patient }}”.</p>
    <div class="card"><div class="card-body p-4">
      <form method="post">{% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">Rating</label>
          {{ form.rating }}
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Comment</label>
          {{ form.comment }}
        </div>
        <button class="btn btn-primary px-4">Submit review</button>
        <a href="{% url 'request_detail' request_obj.pk %}" class="btn btn-light">Cancel</a>
      </form>
    </div></div>
  </div></div>
</div>
{% endblock %}
