{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5"><div class="card"><div class="card-body p-4">
  <h4 class="fw-bold mb-3">Reset your password</h4>
  <p class="small text-muted">Enter your email and we'll send a reset link (printed to the server console in development).</p>
  <form method="post">{% csrf_token %}
    <div class="mb-3">{{ form.email }}</div>
    <button class="btn btn-primary w-100">Send reset link</button>
  </form>
</div></div></div></div>
{% endblock %}
