{% extends "base.html" %}
{% block title %}Email sent{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 text-center">
  <i class="bi bi-envelope-check text-danger" style="font-size:3rem"></i>
  <h4 class="fw-bold mt-2">Check your email</h4>
  <p class="text-muted">If an account exists for that address, a password reset link has been sent.</p>
  <a href="{% url 'login' %}" class="btn btn-outline-primary">Back to login</a>
</div></div>
{% endblock %}
